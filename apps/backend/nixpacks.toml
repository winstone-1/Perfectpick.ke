# Nixpacks Configuration for Railway Deployment
# Reference: https://docs.nixpacks.com/

[variables]
  NODE_ENV = "production"

[phases.setup]
  nixPkgs = ["nodejs-20_x"]

[phases.install]
  cmds = [
    "cd apps/backend && npm ci --omit=dev"
  ]

[phases.build]
  cmds = [
    "cd apps/backend && echo 'No build step required for backend'"
  ]

[phases.start]
  cmds = [
    "cd apps/backend && npm start"
  ]

[variables]
  PORT = "3000"
